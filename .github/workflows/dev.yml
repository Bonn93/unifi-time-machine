name: Dev Branch Build

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # to assume the Chainguard identity
    steps:
      - name: Checkout
        uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1

      - name: Set up chainctl
        uses: chainguard-dev/setup-chainctl@bfe7503a12660737d9d66d02d2610a399d804316 # v0.6.0
        with:
          # gha-unifi-time-machine-go: libraries.go.pull on max.bern, this repo only
          identity: bdabb6e199bd201d825ee8ab78ab0c9b481ac2f4/dbbe39d35ec0b279

      - name: Write Chainguard Libraries credentials
        run: |
          token="$(chainctl auth token --audience libraries.cgr.dev)"
          echo "::add-mask::${token}"
          umask 077
          printf 'machine libraries.cgr.dev\nlogin _token\npassword %s\n' "${token}" > "${RUNNER_TEMP}/netrc"

      - name: Set up QEMU
        uses: chainguard-actions/docker-setup-qemu-action@93beaf39dafe3662779d77874be5e60f4b7250c1 # v4.4.0

      - name: Set up Docker Buildx
        uses: chainguard-actions/docker-setup-buildx-action@9744db81e7643f97efc7d98e7ce3d11d197f3093 # v4.4.1

      - name: Login to Docker Hub
        uses: chainguard-actions/docker-login-action@e866ef65062739486ea6d830a9cd5957df29abea # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: chainguard-actions/docker-build-push-action@7a9792a1d0d1c43df643ef18b1f3a4a495833b23 # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          push: true
          secret-files: |
            netrc=${{ runner.temp }}/netrc
          tags: mbern/unifi-time-machine:dev
