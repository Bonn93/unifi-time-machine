name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # to assume the Chainguard identity
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up chainctl
        uses: chainguard-dev/setup-chainctl@bfe7503a12660737d9d66d02d2610a399d804316 # v0.6.0
        with:
          # gha-unifi-time-machine-go: libraries.go.pull on max.bern, this repo only
          identity: bdabb6e199bd201d825ee8ab78ab0c9b481ac2f4/dbbe39d35ec0b279

      - name: Write Chainguard Libraries credentials
        run: |
          token="$(chainctl auth token --audience libraries.cgr.dev)"
          echo "::add-mask::${token}"
          umask 077
          printf 'machine libraries.cgr.dev\nlogin _token\npassword %s\n' "${token}" > "${RUNNER_TEMP}/netrc"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          push: true
          secret-files: |
            netrc=${{ runner.temp }}/netrc
          tags: |
            mbern/unifi-time-machine:${{ github.ref_name }}
            mbern/unifi-time-machine:latest

  github-release:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # GoReleaser needs full git history to generate the changelog

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
